name: MatchPulse checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:secret
      - name: Scan tracked files for exposed tokens
        run: |
          if git grep -n -E 'FOOTBALL_DATA_TOKEN[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{20,}' -- ':!*.example' ':!*.md'; then
            echo 'A real token was found in tracked source files.'
            exit 1
          fi
